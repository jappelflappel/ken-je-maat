<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C2620">
<title>Ken Je Maat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F6C343'/%3E%3Cpath d='M6 4v10M11 4v6M16 4v10M21 4v6M26 4v10' stroke='%232A2208' stroke-width='2'/%3E%3Ctext x='16' y='28' font-family='Arial Black,sans-serif' font-size='12' text-anchor='middle' fill='%232A2208'%3EKJM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@75..150,500..900&family=Figtree:wght@400;500;700;800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: one stage. Host = wide TV screen with a measuring-tape header; player = a single phone column. Single committed dark "café green + tape yellow" look. */
:root{
  --bg:#0C2620; --surface:#133429; --surface-2:#1B4335; --line:#2C5A49;
  --fg:#F4EEDC; --muted:#A8BFB3; --tape:#F6C343; --tape-ink:#2A2208;
  --coral:#FF6A4D; --sky:#5CC6F2; --mint:#62DFA3;
  --f-display:"Anybody","Arial Black",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
  color-scheme:dark;
}
html,body{min-height:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#app{max-width:1180px;margin:0 auto;padding-block:16px 48px}
#app.phone{max-width:520px}

/* tape */
.tape{position:relative;background-color:var(--tape);color:var(--tape-ink);
  background-image:repeating-linear-gradient(90deg,rgba(42,34,8,.85) 0 2px,transparent 2px 10px),
                   repeating-linear-gradient(90deg,rgba(42,34,8,.9) 0 2px,transparent 2px 50px);
  background-size:100% 26%,100% 48%;background-repeat:no-repeat;background-position:0 0,0 0}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;
  border-radius:10px;padding:22px 16px 10px;margin-bottom:20px}
.logo{font-family:var(--f-display);font-weight:900;font-stretch:135%;font-size:clamp(22px,3.4vw,34px);line-height:1;letter-spacing:-.01em;text-transform:uppercase}
.logo small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;font-weight:500;margin-top:4px;text-transform:uppercase;opacity:.8;font-stretch:100%}
.brand-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--tape-ink);color:var(--tape);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.linkbtn{background:none;border:0;padding:4px 6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:inherit}

/* type */
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.display{font-family:var(--f-display);font-weight:900;font-stretch:120%;line-height:1.02;letter-spacing:-.015em}
.q-text{font-family:var(--f-display);font-weight:800;font-stretch:105%;font-size:clamp(26px,4.4vw,56px);line-height:1.08;text-wrap:balance;margin:0}
.phone .q-text{font-size:clamp(22px,6.4vw,30px)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
p{margin:0}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.section-h h2{font-family:var(--f-display);font-weight:800;font-stretch:115%;font-size:22px}

/* buttons */
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;background:var(--surface-2);color:var(--fg);
  box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .08s ease,box-shadow .08s ease;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-go{background:var(--tape);color:var(--tape-ink)}
.btn-hot{background:var(--coral);color:#2a0d06}
.btn-ghost{background:transparent;box-shadow:none;border:1px solid var(--line)}
.btn-big{font-family:var(--f-display);font-stretch:120%;font-weight:900;font-size:clamp(18px,2.2vw,24px);padding:16px 26px;text-transform:uppercase;letter-spacing:.01em}
.btn-sm{padding:7px 12px;font-size:14px;border-radius:9px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center;margin-top:20px}
.controls .spacer{flex:1}

/* inputs */
.field{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
.field:focus{border-color:var(--sky)}
select.field{padding-right:28px}
.big-input{font-family:var(--f-display);font-weight:900;font-stretch:110%;font-size:40px;text-align:center;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px;width:100%;font-variant-numeric:tabular-nums}
.big-input:focus{border-color:var(--tape);outline:none}
.num-form{display:flex;flex-direction:column;gap:10px}
.lbl{font-weight:700}
.form-err{color:var(--coral);min-height:1.2em;font-size:14px}

/* players */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;max-width:100%}
.chip .sw{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .on{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mint)}
.chip .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 6px}
.chip.nox{padding-right:12px}

/* questions editor */
.qlist{display:flex;flex-direction:column;gap:8px}
.qrow{display:grid;grid-template-columns:28px minmax(110px,150px) minmax(0,1fr) 34px;gap:8px;align-items:center}
.qrow .n{font-family:var(--f-mono);color:var(--muted);text-align:right}
.qrow .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:20px}
@media (max-width:560px){.qrow{grid-template-columns:22px minmax(0,1fr) 30px}.qrow .field.q{grid-column:2 / 3}.qrow .x{grid-row:1 / 3;grid-column:3}}
.counts{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.counts span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.counts span.warn{border-color:var(--coral);color:var(--coral)}

/* stage */
.stage{display:flex;flex-direction:column;gap:22px}
.q-head{display:flex;flex-direction:column;gap:12px}
.about{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(16px,2vw,22px)}
.about .sw{width:18px;height:18px;border-radius:5px;background:var(--c);transform:rotate(8deg)}
.about b{color:var(--c)}
.status-line{font-size:clamp(17px,2vw,22px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dots i{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--tape);animation:bob 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-5px);opacity:1}}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;border-radius:14px;padding:16px 14px;background:var(--surface);border:2px dashed var(--line);min-height:86px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;cursor:pointer;text-align:left}
.tile .nm{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .st{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile.in{background:var(--c);border:2px solid var(--c);color:#14110a;animation:pop .35s ease}
.tile.in .st{color:rgba(20,17,10,.75)}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}

.timer{font-family:var(--f-display);font-weight:900;font-stretch:120%;font-size:clamp(40px,6vw,72px);line-height:1;color:var(--tape);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.timer.low{color:var(--coral)}
.counter{font-family:var(--f-mono);font-size:14px;color:var(--muted)}

.manual{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border-radius:12px;padding:12px}
.manual .field{width:160px}

/* reveal */
.actual{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.actual .big{font-family:var(--f-display);font-weight:900;font-stretch:130%;font-size:clamp(64px,11vw,140px);line-height:.9;color:var(--tape);font-variant-numeric:tabular-nums}
.actual .who{font-size:clamp(17px,2vw,22px);font-weight:700;padding-bottom:10px}
.nl-wrap{overflow-x:auto;padding-bottom:4px}
.nl{position:relative;min-width:520px;margin:64px 8px 0}
.nl .rule{height:30px;border-radius:6px}
.nl .tick{position:absolute;top:34px;transform:translateX(-50%);font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.nl .g{position:absolute;top:6px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.nl .g .d{width:18px;height:18px;border-radius:50%;background:var(--c);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--c)}
.nl .g .stem{width:2px;background:var(--c);opacity:.7}
.nl .g .lab{font-size:13px;font-weight:800;white-space:nowrap;background:var(--surface);border:1px solid var(--c);border-radius:6px;padding:1px 7px;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.nl .pin{position:absolute;top:-58px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.nl .pin .bub{background:var(--fg);color:var(--bg);font-family:var(--f-display);font-weight:900;font-stretch:115%;padding:3px 10px;border-radius:8px;font-size:18px;white-space:nowrap}
.nl .pin .needle{width:4px;height:56px;background:var(--fg);border-radius:2px}
.anim .nl .g{animation:dropin .5s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i) * 90ms)}
.anim .nl .pin{animation:pinin .7s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--n) * 90ms + 350ms)}
@keyframes dropin{from{transform:translate(-50%,-24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes pinin{from{transform:translate(-50%,-40px) scaleY(.4);opacity:0}to{transform:translate(-50%,0);opacity:1}}

.rank{display:flex;flex-direction:column;gap:8px}
.rk{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.rk .pos{font-family:var(--f-display);font-weight:900;font-stretch:120%;font-size:20px;color:var(--muted)}
.rk .nm{font-weight:800;display:flex;gap:8px;align-items:center;min-width:0}
.rk .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .nm .sw{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.rk .det{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.rk .pts{font-family:var(--f-display);font-weight:900;font-stretch:115%;font-size:22px;font-variant-numeric:tabular-nums;color:var(--tape);min-width:4.2ch;text-align:right}
.rk.best{border-color:var(--tape);background:linear-gradient(90deg,rgba(246,195,67,.16),var(--surface) 60%)}
.badge{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--tape);color:var(--tape-ink);border-radius:4px;padding:1px 6px;flex:none}
.badge.hot{background:var(--coral);color:#2a0d06}
.anim .rk{animation:slidein .45s ease both;animation-delay:calc(var(--i) * 70ms + 200ms)}
@keyframes slidein{from{transform:translateX(-16px);opacity:0}to{transform:none;opacity:1}}

/* leaderboard */
.lb{display:flex;flex-direction:column;gap:10px}
.lb-row{display:grid;grid-template-columns:34px minmax(90px,180px) minmax(0,1fr) auto;gap:12px;align-items:center}
.lb-row .pos{font-family:var(--f-display);font-weight:900;font-stretch:120%;font-size:22px;color:var(--muted);text-align:right}
.lb-row .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .bar{height:34px;border-radius:8px;background:var(--c);width:calc(var(--w) * 1%);min-width:6px;transform-origin:left center}
.lb-row .tot{font-family:var(--f-display);font-weight:900;font-stretch:115%;font-size:22px;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:baseline;justify-content:flex-end;min-width:7ch}
.lb-row .tot small{font-family:var(--f-mono);font-size:12px;color:var(--mint);font-weight:500}
.lb-row .mv{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.anim .lb-row .bar{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 80ms)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (max-width:560px){.lb-row{grid-template-columns:26px minmax(0,1fr) auto}.lb-row .barcell{grid-column:1 / -1}}

/* end */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;max-width:720px;margin:0 auto;width:100%}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.pod .nm{font-weight:800;font-size:clamp(15px,2vw,20px);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .blk{width:100%;border-radius:12px 12px 4px 4px;background:var(--c);color:#14110a;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding-top:12px;font-family:var(--f-display);font-weight:900;font-stretch:125%}
.pod .blk .p{font-size:clamp(28px,5vw,52px);line-height:1}
.pod .blk .s{font-size:14px;font-family:var(--f-mono);font-weight:500;font-stretch:100%}
.pod.p1 .blk{height:200px}.pod.p2 .blk{height:150px}.pod.p3 .blk{height:110px}
.anim .pod .blk{animation:rise .8s cubic-bezier(.2,.9,.3,1.1) both;transform-origin:bottom}
.anim .pod.p1 .blk{animation-delay:.9s}.anim .pod.p2 .blk{animation-delay:.5s}.anim .pod.p3 .blk{animation-delay:.1s}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.award{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.award .t{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tape)}
.award .w{font-family:var(--f-display);font-weight:900;font-stretch:115%;font-size:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.award .d{color:var(--muted);font-size:14px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;min-width:520px;width:100%;height:auto}

/* misc */
.notice{border-left:4px solid var(--sky);background:var(--surface);padding:12px 14px;border-radius:8px;font-size:15px}
.notice.warn{border-color:var(--coral)}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.splash{min-height:60vh;justify-content:center}
.role-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;width:100%;max-width:720px}
.role-pick button{text-align:left;align-items:flex-start;flex-direction:column;padding:22px;gap:6px}
.role-pick b{font-family:var(--f-display);font-stretch:120%;font-weight:900;font-size:22px}
.role-pick span{font-weight:500;font-size:15px;opacity:.85}
.me-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
.me-bar .chip{background:transparent}
.big-score{font-family:var(--f-display);font-weight:900;font-stretch:130%;font-size:64px;line-height:1;color:var(--tape);font-variant-numeric:tabular-nums}
.ok{color:var(--mint);font-weight:800}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface-2);padding:6px 10px;border-radius:10px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;counter-reset:s}
.howto div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px}
.howto b{display:block;font-family:var(--f-display);font-stretch:115%;font-size:17px;margin-bottom:4px}
.join-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.qr{background:#fff;border-radius:12px;padding:8px;width:150px;height:150px}
.qr svg{display:block;width:100%;height:100%}
.code{font-family:var(--f-display);font-weight:900;font-stretch:125%;font-size:clamp(28px,3.2vw,44px);letter-spacing:.04em;line-height:1;color:var(--tape);overflow-wrap:anywhere}
.url{font-family:var(--f-mono);font-size:13px;word-break:break-all;color:var(--muted)}
@media (max-width:480px){.join-card{grid-template-columns:minmax(0,1fr)}.qr{margin:0 auto}}
.code-input{text-transform:uppercase;letter-spacing:.12em}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(() => {
"use strict";

/* ---------- data ---------- */
const BANK = [
  "Hoe vaak ben je in je leven dronken naar huis gefietst?",
  "Hoeveel landen heb je in totaal bezocht?",
  "Hoeveel uur per dag zit je gemiddeld op je telefoon?",
  "Hoeveel ongelezen mails heb je nu?",
  "Hoeveel foto's staan er op je telefoon?",
  "Hoe vaak is je fiets in je leven gestolen of kwijtgeraakt?",
  "Hoeveel kopjes koffie drink je per week?",
  "Hoeveel euro geef je per maand uit aan bezorgmaaltijden en uit eten?",
  "Hoe vaak snooze je op een gemiddelde ochtend?",
  "Hoeveel festivals heb je in je leven bezocht?",
  "Hoeveel keer ben je in je leven verhuisd?",
  "Hoeveel boeken heb je het afgelopen jaar uitgelezen?",
  "Hoeveel apps staan er op je telefoon?",
  "Hoeveel seconden kun je je adem inhouden?",
  "Hoeveel push-ups kun je achter elkaar doen?",

/* ---------- scoring ---------- */
// Accuracy = smaller/greater of guess and answer (+1 smoothing so 0 works). 2x off = ~50%, 10x off = ~10%.

  const closest = Object.keys(acc).filter(id => acc[id] >= best - 1e-9);
  for (const id of Object.keys(acc)) {

}

  return t;
}

}

/* ---------- state ---------- */
// Transport: a public MQTT broker over WebSocket. The host's browser is the authority and
// publishes the game state (retained) to kenjemaat/v1/<code>/state; each phone publishes its
// presence (name + current answer, retained) to kenjemaat/v1/<code>/in/<pid>.
const BROKER = "wss://broker.hivemq.com:8884/mqtt";

const topic = (code, sub) => `kenjemaat/v1/${code}/${sub}`;

const cleanCode = c => String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
const S = {

  mq: null, conn: false, code: null, peers: new Map(), pres: {}, everConnected: false,
  state: null, online: new Set(),
  deviceId: null, myPid: null, myName: ls.get("kjm-name", ""), myAns: null,

  lastKey: "", animKey: "", writing: false, dirty: false, writeT: null, autoT: null

function newState(prev) {
  const qs = prev?.questions?.length ? prev.questions.map(q => ({ ...q, id: rid() }))
    : [BANK[0], ...shuffle(BANK.slice(1)).slice(0, 3)].map(text => ({ id: rid(), text, subject: null }));
  return {
    v: 1, gameId: rid(), phase: "lobby",
    players: prev?.players ?? [], questions: qs, qi: 0,
    pending: { subject: null, guesses: {} }, results: [],
    settings: prev?.settings ?? { timer: 45, bonus: true },
    endsAt: null, removed: prev?.removed ?? [], updatedAt: Date.now()

}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const player = (st, id) => st.players.find(p => p.id === id);
const pname = (st, id) => player(st, id)?.name || "Iemand";
const pcolor = (st, id) => safeColor(player(st, id)?.color);
const curQ = st => st.questions[st.qi];
const curKey = st => (st.phase === "answer" || st.phase === "guess") && curQ(st) ? `${st.gameId}|${curQ(st).id}|${st.phase}` : null;
const guessers = st => st.players.filter(p => p.id !== curQ(st)?.subject);

}

}

/* ---------- host: persistence ---------- */
function mutate(fn) { fn(S.state); S.state.updatedAt = Date.now(); save(); render(); }
function save() {

}

  S.mq.publish(topic(S.code, "state"), JSON.stringify(S.state), { qos: 1, retain: true }, err => {
    const msg = err ? "Versturen naar de telefoons lukt even niet. Het spel probeert het opnieuw zodra er verbinding is." : null;

/* ---------- host: game flow ---------- */

    st.results = []; st.qi = 0; st.gameId = rid();

}
function enterQuestion(st) {

}

    st.phase = "guess"; st.endsAt = st.settings.timer ? Date.now() + st.settings.timer * 1000 : null;
  });
}

    const r = scoreRound(actual, valid, st.settings);
    st.results.push({ qid: q.id, text: q.text, subject: q.subject, actual, guesses: valid, points: r.points, acc: r.acc, closest: r.closest });
    st.phase = "reveal"; st.endsAt = null;

}
const toScores = () => mutate(st => { if (st.phase === "reveal") st.phase = "scores"; });
const nextQuestion = () => mutate(st => { st.qi++; enterQuestion(st); });
const skipQuestion = () => { clearTimeout(S.autoT); mutate(st => { st.qi++; enterQuestion(st); }); };

  if (st.phase === "guess" && pl.id !== q.subject) { if (st.pending.guesses[pl.id] === v) return false; st.pending.guesses[pl.id] = v; return true; }
  return false;
}

function hostPeers() {
  const st = S.state; if (!st) return;
  const online = new Set(); let changed = false;
  const key = curKey(st);
  for (const [pid, p] of S.peers) {
    const pr = p.presence || {};
    if (pr.role !== "player" || pr.pid !== pid) continue;
    const name = cleanName(pr.name);
    const fresh = Date.now() - p.seen < 25000;
    if (!name || st.removed.includes(pid)) continue;
    let pl = st.players.find(x => x.pid === pid);
    if (!pl) {
      pl = st.players.find(x => !x.pid && x.name.toLowerCase() === name.toLowerCase());
      if (pl) { pl.pid = pid; changed = true; }
      else if (st.players.length < 40) { pl = { id: rid(), name: uniqueName(st, name), color: nextColor(st), pid }; st.players.push(pl); changed = true; }
      else continue;
    }
    if (fresh) online.add(pl.id);
    if (pl.name !== name && !st.players.some(x => x !== pl && x.name.toLowerCase() === name.toLowerCase())) { pl.name = name; changed = true; }
    const a = pr.ans;
    if (key && a && typeof a === "object" && a.k === key) { const v = num(a.v); if (v != null && recordValue(st, pl, v)) changed = true; }

function hostEnd(st) {

    st.results.length ? h("section", { class: "card stack" }, h("h2", { class: "display", style: "font-size:22px" }, "Puntenverloop"), h("div", { class: "chart-wrap" }, progressChart(st))) : null,
    st.results.length ? h("section", { class: "card stack" }, h("h2", { class: "display", style: "font-size:22px" }, "Groep tegen werkelijkheid"), groupTable(st, stats)) : null,
    h("div", { class: "controls" },

/* ---------- player views ---------- */
function numberForm(id, label, onSubmit, opts = {}) {
  const inp = h("input", { id, "data-keep": true, class: "big-input", inputmode: "decimal", autocomplete: "off", placeholder: "0", "aria-label": label, disabled: opts.disabled, enterkeyhint: "send" });
  const err = h("p", { class: "form-err", "aria-live": "polite" });
  return h("form", { class: "num-form", onsubmit: e => { e.preventDefault(); const v = num(inp.value); if (v == null) { err.textContent = "Vul een getal in, 0 of hoger. Bijvoorbeeld 12 of 3,5."; return; } err.textContent = ""; onSubmit(v); inp.blur(); } },
    h("label", { class: "lbl", for: id }, label), inp,
    h("button", { class: "btn btn-go btn-big", type: "submit", disabled: opts.disabled }, opts.cta || "Verstuur"), err);
}
function viewPlayer() {
  const st = S.state;
  const top = brand(S.myName && meIn(st) ? [h("span", { class: "pill" }, h("span", { class: "dot", style: `background:${safeColor(meIn(st).color)}` }), meIn(st).name)] : null);
  const connNote = !S.conn && (S.everConnected || S.ui.connSlow) ? h("p", { class: "notice warn" }, "Geen verbinding met het spel. Je telefoon probeert het opnieuw.") : null;
  if (st?.removed?.includes(S.myPid)) return h("div", { class: "stack" }, top, h("p", { class: "notice warn" }, "De host heeft je uit dit spel gehaald."));
  if (!S.myName || !S.joined) return h("div", { class: "stack" }, top, connNote, playerJoin(st));
  const me = meIn(st);
  if (!st) return h("div", { class: "stack" }, top, connNote,
    S.ui.loadNote ? h("p", { class: "notice warn" }, S.ui.loadNote) : h("p", { class: "card status-line" }, `Zoeken naar spel ${S.code}`, h("span", { class: "dots" }, h("i"), h("i"), h("i"))),
    h("button", { class: "linkbtn", onclick: () => { location.hash = ""; } }, "Andere code invullen"));
  if (!me) return h("div", { class: "stack" }, top, h("p", { class: "card status-line" }, "Aanmelden bij de host", h("span", { class: "dots" }, h("i"), h("i"), h("i"))), h("p", { class: "muted" }, "Staat het grote scherm open? Daar verschijnt je naam zo."));
  const body = st.phase === "lobby" ? pLobby(st, me)
    : st.phase === "answer" ? pAnswer(st, me)
    : st.phase === "guess" ? pGuess(st, me)
    : st.phase === "reveal" ? pReveal(st, me)
    : st.phase === "scores" ? pScores(st, me)
    : pEnd(st, me);
  return h("div", { class: "stack" }, top, body);
}
function playerJoin(st) {
  const inp = h("input", { id: "join-name", "data-keep": true, class: "big-input", style: "font-size:28px", maxlength: 24, autocomplete: "off", placeholder: "Je naam", value: S.myName || "", "aria-label": "Je naam", enterkeyhint: "go" });
  return h("form", { class: "card stack", onsubmit: e => { e.preventDefault(); if (!cleanName(inp.value)) return; S.joined = true; joinAs(inp.value); } },
    h("h1", { class: "display", style: "font-size:30px" }, "Doe mee"),
    h("p", { class: "muted" }, "Vul de naam in die je vrienden kennen. Je verschijnt dan op het grote scherm."),
    inp, h("button", { class: "btn btn-go btn-big", type: "submit" }, "Doe mee"),
    st?.players?.length ? h("div", { class: "stack" }, h("p", { class: "eyebrow" }, "Al in het spel"), h("div", { class: "chips" }, st.players.map(p => h("span", { class: "chip nox", style: `--c:${safeColor(p.color)}` }, h("span", { class: "sw" }), h("span", { class: "nm" }, p.name))))) : null);
}
function pLobby(st, me) {
  return h("div", { class: "stack" },
    h("div", { class: "card center" }, h("p", { class: "ok", style: "font-size:20px" }, `Je doet mee als ${me.name}`), h("p", { class: "muted" }, "Wacht tot de host het spel start. Laat je telefoon open."),
      h("button", { class: "linkbtn", onclick: () => { S.joined = false; render(); } }, "Naam wijzigen")),
    h("div", { class: "stack" }, h("p", { class: "eyebrow" }, `${st.players.length} spelers`), h("div", { class: "chips" }, st.players.map(p => h("span", { class: "chip nox", style: `--c:${safeColor(p.color)}` }, h("span", { class: "sw" }), h("span", { class: "nm" }, p.name + (p.id === me.id ? " (jij)" : "")))))),
    howTo());
}
function pQ(st) {
  const q = curQ(st);
  return h("div", { class: "card stack" },
    h("p", { class: "eyebrow" }, `Vraag ${st.qi + 1} van ${st.questions.length}`),
    h("p", { class: "about", style: `--c:${pcolor(st, q.subject)}` }, h("span", { class: "sw" }), "Over ", h("b", null, q.subject === meIn(st)?.id ? "jou" : pname(st, q.subject))),
    h("h1", { class: "q-text" }, q.text));
}
function sentNote(recorded) {
  const mine = S.myAns && S.myAns.k === curKey(S.state) ? S.myAns.v : null;
  if (recorded != null) return h("p", { class: "ok", "aria-live": "polite" }, `Ontvangen: ${fmt(recorded)}. Je kunt het nog aanpassen tot de host verder gaat.`);
  if (mine != null) return h("p", { class: "muted", "aria-live": "polite" }, `Versturen: ${fmt(mine)}…`);
  return null;
}
function pAnswer(st, me) {
  const q = curQ(st);
  if (q.subject !== me.id) return h("div", { class: "stack" }, pQ(st), h("p", { class: "card status-line" }, `${pname(st, q.subject)} vult nu een eigen inschatting in. Bedenk alvast wat je gaat raden.`));
  return h("div", { class: "stack" }, pQ(st),
    h("div", { class: "card stack" },
      numberForm(`ans-${st.gameId}-${q.id}`, "Jouw eigen inschatting (niemand ziet het)", playerSubmit, { cta: "Verstuur mijn antwoord" }),
      sentNote(st.pending.subject)));
}
function pGuess(st, me) {
  const q = curQ(st), left = cdLeft(st), over = left === 0;
  const g = guessers(st), inCount = g.filter(p => st.pending.guesses[p.id] != null).length;
  if (q.subject === me.id) return h("div", { class: "stack" }, pQ(st), h("div", { class: "card center" }, h("p", { class: "status-line" }, "Iedereen raadt nu wat jij hebt ingevuld."), h("p", { class: "counter num" }, `${inCount} van ${g.length} binnen`)));
  return h("div", { class: "stack" }, pQ(st),
    h("div", { class: "card stack" },
      left != null ? h("div", { class: "row", style: "justify-content:space-between" }, h("span", { class: "eyebrow" }, "Tijd"), h("span", { class: "timer" + (left <= 5 ? " low" : ""), style: "font-size:40px", "data-cd": true }, left)) : null,
      numberForm(`g-${st.gameId}-${q.id}`, `Wat heeft ${pname(st, q.subject)} ingevuld?`, playerSubmit, { cta: "Verstuur mijn gok" }),
      over ? h("p", { class: "muted" }, "De tijd is om. De host onthult zo.") : null,
      sentNote(st.pending.guesses[me.id])));
}
function pReveal(st, me) {
  const r = st.results[st.results.length - 1];
  const anim = animOnce("prev-" + st.gameId + st.results.length);
  if (r.subject === me.id) {
    const accs = Object.values(r.acc), avg = accs.length ? accs.reduce((a, b) => a + b, 0) / accs.length : null;
    return h("div", { class: "stack " + anim }, h("div", { class: "card center" },
      h("p", { class: "eyebrow" }, "Jouw antwoord"), h("span", { class: "big-score" }, fmt(r.actual)),
      avg != null ? h("p", null, `De groep zat gemiddeld ${pct(avg)} goed bij jou.`) : null),
      roundRanking(st, r, me.id));
  }
  const g = r.guesses[me.id], pts = r.points[me.id] || 0;
  return h("div", { class: "stack " + anim },
    h("div", { class: "card center" },
      h("p", { class: "eyebrow" }, `${pname(st, r.subject)} zei`), h("span", { class: "big-score" }, fmt(r.actual)),
      g == null ? h("p", { class: "muted" }, "Je hebt niet geraden.")

      h("p", { class: "display", style: "font-size:34px;color:var(--mint)" }, `+${pts}`),
      r.closest.includes(me.id) ? h("span", { class: "badge" }, r.acc[me.id] === 1 ? "Voltreffer" : "Dichtstbij") : null),
    roundRanking(st, r, me.id));
}
function pScores(st, me) {
  const rk = ranking(st), pos = rk.findIndex(x => x.p.id === me.id);
  return h("div", { class: "stack " + animOnce("psc-" + st.gameId + st.results.length) },
    h("div", { class: "card center" }, h("p", { class: "eyebrow" }, "Jij staat"), h("span", { class: "big-score" }, `#${pos + 1}`), h("p", { class: "num" }, `${(rk[pos]?.total || 0).toLocaleString("nl-NL")} punten`)),
    h("div", { class: "card" }, leaderboard(st, me.id, 5)));
}
function pEnd(st, me) {
  const rk = ranking(st), pos = rk.findIndex(x => x.p.id === me.id);
  const anim = animOnce("pend-" + st.gameId);
  const accs = st.results.map(r => r.acc[me.id]).filter(a => a != null);
  const wins = st.results.filter(r => r.closest.includes(me.id)).length;
  return h("div", { class: "stack " + anim },
    h("div", { class: "card center" }, h("p", { class: "eyebrow" }, "Eindstand"), h("span", { class: "big-score" }, `#${pos + 1}`),
      h("p", { class: "num" }, `${(rk[pos]?.total || 0).toLocaleString("nl-NL")} punten`),
      accs.length ? h("p", { class: "muted" }, `Gemiddeld ${pct(accs.reduce((a, b) => a + b, 0) / accs.length)} raak · ${wins}× dichtstbij`) : null),
    st.results.length ? podium(st, anim) : null,
    st.results.length ? awards(st, computeStats(st)) : null);
}

/* ---------- boot ---------- */
function connect(onConnect, onMessage) {
  if (!window.mqtt) { S.ui.connSlow = true; render(); return; }
  const c = mqtt.connect(BROKER, { clientId: "kjm_" + rid() + rid(), clean: true, reconnectPeriod: 2500, connectTimeout: 10000, keepalive: 30, protocolVersion: 4 });
  S.mq = c;
  const slow = setTimeout(() => { if (!S.conn) { S.ui.connSlow = true; render(); } }, 8000);
  c.on("connect", () => { clearTimeout(slow); S.conn = true; S.everConnected = true; S.ui.connSlow = false; onConnect(); render(); });
  const down = () => { if (S.conn) { S.conn = false; render(); } };
  c.on("close", down); c.on("offline", down);
  c.on("error", () => {});
  c.on("message", (t, buf, packet) => {
    let data = null;
    try { const txt = buf.toString(); data = txt ? JSON.parse(txt) : null; } catch {}
    onMessage(t, data, packet);
  });
}
function startHost(code) {
  S.role = "host"; S.code = code; S.ui.loading = false;
  history.replaceState(null, "", "#host-" + code);
  S.state = ls.get("kjm-host-" + code, null);
  if (!S.state?.players) S.state = newState();
  if (!S.state.removed) S.state.removed = [];
  save();
  connect(() => { S.mq.subscribe(topic(code, "in/+"), { qos: 1 }); flush(); }, (t, data, packet) => {
    const pid = t.split("/").pop();
    if (!data || typeof data !== "object") S.peers.delete(pid);
    else S.peers.set(pid, { presence: data, seen: packet?.retain ? Math.min(Date.now(), +data.t || 0) : Date.now() });
    clearTimeout(S.peerT); S.peerT = setTimeout(hostPeers, 60);
  });
  setInterval(hostPeers, 5000);
  checkAuto(); render();
}
function startPlayer(code) {
  S.role = "player"; S.code = code; S.ui.loading = false;
  if (S.myName) S.joined = true;
  const notFound = setTimeout(() => { if (!S.state) { S.ui.loadNote = `Geen spel gevonden met code ${code}. Klopt de code, en staat het grote scherm open?`; render(); } }, 9000);
  connect(() => { S.mq.subscribe(topic(code, "state"), { qos: 1 }); if (S.joined) joinAs(S.myName); }, (t, data) => {
    if (t !== topic(code, "state") || !data?.players) return;
    clearTimeout(notFound); S.ui.loadNote = null; S.state = data; render();
  });
  setInterval(() => { if (S.joined && S.conn) pPresence({}); }, 8000);
  render();
}
function boot() {
  S.deviceId = ls.get("kjm-dev", null) || (() => { const d = rid() + rid(); ls.set("kjm-dev", d); return d; })();
  S.myPid = String(S.deviceId).replace(/[^a-z0-9]/gi, "") || rid();
  S.ui.loading = false;
  const hsh = decodeURIComponent(location.hash.slice(1));
  if (/^host-/i.test(hsh)) { const c = cleanCode(hsh.slice(5)); if (c.length === 6) return startHost(c); }
  const c = cleanCode(hsh);
  if (c.length === 6) return startPlayer(c);
  S.role = "landing"; render();
}
window.addEventListener("hashchange", () => location.reload());

/* countdown + timeouts */
setInterval(() => {
  const st = S.state; if (!st || st.phase !== "guess" || !st.endsAt) return;
  const left = cdLeft(st);
  document.querySelectorAll("[data-cd]").forEach(el => { el.textContent = left; el.classList.toggle("low", left <= 5); });
  if (left === 0 && S.ui.expired !== st.endsAt) { S.ui.expired = st.endsAt; render(); }
  if (S.role === "host" && Date.now() > st.endsAt + 800 && st.phase === "guess") reveal();
}, 250);

boot();
})();
</script>
